name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's apt shellcheck can lag the one used locally: print it so a
      # version-dependent finding is diagnosable. Config lives in .shellcheckrc.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck bin/*.sh lib/*.sh

      - name: tests
        run: bash tests/common_test.sh

      # bin/*.sh against stub gwm/herdr/fzf/gh (the runner's real gh is shadowed).
      - name: script tests
        run: bash tests/scripts_test.sh
